<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TrendWatch — UGC Ninja</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css?v=4" rel="stylesheet">
</head>
<body>

<nav class="topnav">
    <a class="topnav-brand" href="/">🥷 UGC Ninja <em>TrendWatch</em></a>
    <a href="/overview" class="topnav-link {% if active_page == 'overview' %}active{% endif %}">Overview</a>
    <a href="/" class="topnav-link {% if active_page == 'campaigns' or not active_page %}active{% endif %}">Campaigns</a>
    <a href="/tags" class="topnav-link {% if active_page == 'tags' %}active{% endif %}">Tags</a>
    <a href="/enrich" class="topnav-link {% if active_page == 'enrich' %}active{% endif %}">Enrich</a>
    <a href="/comments" class="topnav-link {% if active_page == 'comments' %}active{% endif %}">Comments</a>
    <div class="topnav-sep"></div>
    <div class="topnav-right">
        <a href="https://app.scrapecreators.com" target="_blank" id="sc-balance" style="font-size:.8rem;color:#ccc;background:rgba(255,255,255,.08);padding:3px 8px;border-radius:20px;margin-right:8px;text-decoration:none" title="ScrapeCreators credits — click to open dashboard"></a>
        <a href="/campaigns/new" class="btn-nav btn-nav-primary">+ New Campaign</a>
        <a href="/system" class="btn-nav">⚙ Settings</a>
        <a href="/logout" class="btn-nav">Logout</a>
    </div>
</nav>

<div class="page">
    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function loadBalance() {
  fetch('/api/balance')
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('sc-balance');
      if (el && data.sc_credits !== null && data.sc_credits !== undefined) {
        el.textContent = '✦ ' + Number(data.sc_credits).toLocaleString() + ' credits';
      }
    })
    .catch(() => {});
}
loadBalance();
setInterval(loadBalance, 60000);
</script>
</body>
</html>
