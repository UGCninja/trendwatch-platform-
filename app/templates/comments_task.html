{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1 class="page-title">Comments</h1>
  <p class="page-subtitle" id="subtitle">Обрабатываем...</p>
</div>

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body p-4" style="text-align:center">

        <div id="stateProcessing">
          <div class="spinner-border text-primary mb-3" role="status"></div>
          <div class="fw-semibold mb-2" id="progressText">Запускаем...</div>
          <div class="progress mb-2" style="height:8px;border-radius:4px">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width:0%"></div>
          </div>
          <div class="text-muted" id="progressCount" style="font-size:.85rem"></div>
        </div>

        <div id="stateDone" style="display:none">
          <div style="font-size:3rem;margin-bottom:.75rem">✅</div>
          <div class="fw-semibold mb-1">Готово!</div>
          <div class="text-muted mb-3" id="doneText" style="font-size:.9rem"></div>
          <a id="downloadBtn" href="/comments/download/{{ task_id }}" class="btn btn-primary px-4 py-2">
            Скачать файл
          </a>
          <div class="mt-3">
            <a href="/comments" class="text-muted" style="font-size:.85rem">Новый запрос</a>
          </div>
        </div>

        <div id="stateError" style="display:none">
          <div style="font-size:3rem;margin-bottom:.75rem">❌</div>
          <div class="fw-semibold mb-1">Ошибка</div>
          <div class="text-muted mb-3" id="errorText" style="font-size:.9rem"></div>
          <a href="/comments" class="btn btn-outline-secondary px-4">Попробовать снова</a>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
const taskId = "{{ task_id }}";
let pollInterval;

const statusLabels = {
  queued:     "В очереди...",
  collecting: "Собираем комментарии",
  auditing:   "Claude анализирует комментарии...",
};

function poll() {
  fetch(`/api/comments/status/${taskId}`)
    .then(r => r.json())
    .then(data => {
      const { status, done, total, comments_count, error, filename, result_type } = data;

      if (status === "queued" || status === "auditing") {
        document.getElementById("progressText").textContent = statusLabels[status] || status;
        if (status === "auditing") {
          document.getElementById("progressBar").style.width = "90%";
          document.getElementById("progressCount").textContent = `Собрано комментариев: ${comments_count}`;
          document.getElementById("subtitle").textContent = "Claude читает комментарии...";
        }

      } else if (status === "collecting") {
        const pct = total > 0 ? Math.round(done / total * 100) : 0;
        document.getElementById("progressBar").style.width = pct + "%";
        document.getElementById("progressText").textContent = `Собираем комментарии... ${pct}%`;
        document.getElementById("progressCount").textContent = `Постов обработано: ${done} из ${total}`;
        document.getElementById("subtitle").textContent = "Собираем комментарии по постам...";

      } else if (status === "done") {
        clearInterval(pollInterval);
        document.getElementById("stateProcessing").style.display = "none";
        document.getElementById("stateDone").style.display = "block";
        document.getElementById("subtitle").textContent = "Файл готов!";
        const label = result_type === "html" ? "HTML-аудит" : "CSV с комментариями";
        document.getElementById("doneText").textContent =
          `${label} · ${comments_count} комментариев · ${filename}`;

      } else if (status === "error") {
        clearInterval(pollInterval);
        document.getElementById("stateProcessing").style.display = "none";
        document.getElementById("stateError").style.display = "block";
        document.getElementById("subtitle").textContent = "Что-то пошло не так";
        document.getElementById("errorText").textContent = error || "Неизвестная ошибка";
      } else if (status === "not_found") {
        clearInterval(pollInterval);
        document.getElementById("stateProcessing").style.display = "none";
        document.getElementById("stateError").style.display = "block";
        document.getElementById("subtitle").textContent = "Задача потеряна";
        document.getElementById("errorText").textContent = "Сервер перезапустился во время сбора. Вернись в проект и нажми Обновить снова.";
      }
    })
    .catch(() => {});
}

poll();
pollInterval = setInterval(poll, 2000);
</script>
{% endblock %}
